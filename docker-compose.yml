name: pc-value-analyzer-market-v3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcvalue
      POSTGRES_USER: pcvalue
      POSTGRES_PASSWORD: pcvalue
    ports: ["${POSTGRES_HOST_PORT:-5434}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcvalue -d pcvalue"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    image: pc-value-analyzer-market-v3-mlflow:latest
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    command: >-
      mlflow server
      --backend-store-uri postgresql+psycopg://pcvalue:pcvalue@postgres:5432/mlflow
      --default-artifact-root /mlartifacts
      --host 0.0.0.0 --port 5000
    ports: ["${MLFLOW_HOST_PORT:-5002}:5000"]
    volumes: ["mlflow_artifacts:/mlartifacts"]
    depends_on:
      postgres:
        condition: service_healthy

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["${PREFECT_HOST_PORT:-4202}:4200"]

  backend:
    image: pc-value-analyzer-market-v3-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &app-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://pcvalue:pcvalue@postgres:5432/pcvalue
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ARTIFACT_PATH: /app/backend/artifacts/price_model.joblib
      MODEL_METADATA_PATH: /app/backend/artifacts/model_metadata.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082}
      LIVE_MARKET_ENABLED: ${LIVE_MARKET_ENABLED:-true}
      MARKET_CURRENCY: ${MARKET_CURRENCY:-CAD}
      LIVE_COMP_MAX_AGE_HOURS: ${LIVE_COMP_MAX_AGE_HOURS:-72}
      LIVE_COMP_MAX_RESULTS: ${LIVE_COMP_MAX_RESULTS:-12}
      LIVE_COMP_MIN_SIMILARITY: ${LIVE_COMP_MIN_SIMILARITY:-0.52}
      LIVE_COMP_BLEND_CAP: ${LIVE_COMP_BLEND_CAP:-0.68}
      MARKET_CACHE_TTL_HOURS: ${MARKET_CACHE_TTL_HOURS:-24}
      MARKET_REFRESH_TOKEN: ${MARKET_REFRESH_TOKEN:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_CA}
      EBAY_CATEGORY_ID: ${EBAY_CATEGORY_ID:-179}
      EBAY_SEARCH_QUERIES: ${EBAY_SEARCH_QUERIES:-gaming desktop,rtx gaming pc,custom gaming pc}
      EBAY_RESULT_LIMIT: ${EBAY_RESULT_LIMIT:-50}
      BESTBUY_API_KEY: ${BESTBUY_API_KEY:-}
      BESTBUY_CATEGORY_ID: ${BESTBUY_CATEGORY_ID:-pcmcat287600050002}
      BESTBUY_RESULT_LIMIT: ${BESTBUY_RESULT_LIMIT:-100}
      BANK_OF_CANADA_FX_ENABLED: ${BANK_OF_CANADA_FX_ENABLED:-true}
      USD_TO_CAD_OVERRIDE: ${USD_TO_CAD_OVERRIDE:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GOOGLE_SHOPPING_QUERIES: ${GOOGLE_SHOPPING_QUERIES:-gaming desktop,RTX gaming PC,Ryzen gaming desktop,prebuilt gaming PC,custom gaming PC}
      GOOGLE_SHOPPING_LOCATION: ${GOOGLE_SHOPPING_LOCATION:-Calgary, Alberta, Canada}
      GOOGLE_SHOPPING_GL: ${GOOGLE_SHOPPING_GL:-ca}
      GOOGLE_SHOPPING_HL: ${GOOGLE_SHOPPING_HL:-en}
      GOOGLE_SHOPPING_CURRENCY: ${GOOGLE_SHOPPING_CURRENCY:-CAD}
      GOOGLE_SHOPPING_RESULT_LIMIT: ${GOOGLE_SHOPPING_RESULT_LIMIT:-40}
    ports: ["${API_HOST_PORT:-8002}:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  market-refresher:
    image: pc-value-analyzer-market-v3-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m ml.pipeline.live_market_flow
    environment:
      <<: *app-environment
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: pc-value-analyzer-market-v3-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
    ports: ["${WEB_HOST_PORT:-8082}:80"]
    depends_on: [backend]

volumes:
  postgres_data:
  mlflow_artifacts:
