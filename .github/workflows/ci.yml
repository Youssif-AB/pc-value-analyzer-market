name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check backend ml tests
      - run: pytest --cov=backend --cov=ml --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for API health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8002/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend
          exit 1
      - name: Wait for web app
        shell: bash
        run: |
          for i in {1..40}; do
            if curl --fail --silent http://localhost:8082 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs frontend
          exit 1
      - name: Check market status endpoint
        run: curl --fail http://localhost:8002/api/v1/market/status
      - name: Show container status
        run: docker compose ps
      - name: Clean up
        if: always()
        run: docker compose down -v
