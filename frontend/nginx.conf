server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This is a local portfolio app; prefer correctness over browser caching so a
  # rebuilt frontend is immediately visible after container replacement.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
